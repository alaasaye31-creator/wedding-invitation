    <style>
        :root {
            --burgundy-dark: #380D12;
            --burgundy: #4E131A;
            --burgundy-light: #6B1D26;
            --cream: #F7F1E8;
            --cream-dark: #EAE0D2;
            --gold: #C9A255;
            --gold-light: #E8CF96;
            --text-dark: #2C0B0E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--burgundy-dark);
            color: var(--cream);
            overflow-x: hidden;
            line-height: 1.7;
        }

        #envelope-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, var(--burgundy-light) 0%, var(--burgundy-dark) 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            overflow: hidden;
        }

        #envelope-screen.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .envelope-flaps {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .envelope-flaps::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 52%;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.25) 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 1px solid rgba(201, 162, 85, 0.3);
            transition: transform 1s ease;
            transform-origin: top;
        }

        #envelope-screen.opening .envelope-flaps::before {
            transform: rotateX(180deg);
        }

        .gold-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 223, 140, 0.9) 0%, rgba(201, 162, 85, 0) 70%);
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s ease;
            pointer-events: none;
        }

        #envelope-screen.opening .gold-glow {
            opacity: 1;
            transform: scale(3.5);
        }

        .wax-seal {
            position: relative;
            z-index: 10;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #8E2430, #4A0E15);
            border: 3px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(201, 162, 85, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: pulseSeal 2.2s infinite;
            transition: transform 0.4s ease;
        }

        .wax-seal:hover {
            transform: scale(1.06);
        }

        .wax-seal span {
            font-family: 'Aref Ruqaa', serif;
            color: var(--gold-light);
            font-size: 1.5rem;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .tap-hint {
            position: relative;
            z-index: 10;
            margin-top: 22px;
            color: var(--gold-light);
            font-family: 'Amiri', serif;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

            0% { box-shadow: 0 0 0 0 rgba(201, 162, 85, 0.6), 0 10px 25px rgba(0,0,0,0.5); }
